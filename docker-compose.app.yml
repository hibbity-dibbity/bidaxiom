# Runs the whole app locally in Docker: database, Redis, and file storage from
# docker-compose.yml, plus the API and web app built from their Dockerfiles.
#
#   docker compose -f docker-compose.app.yml up --build
#
# Then open http://localhost:3000. The API is at http://localhost:3001.
include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://construction:construction_dev@postgres:5432/construction_mgmt
      REDIS_URL: redis://redis:6379
      # The BullMQ workers (reports, QuickBooks, calendar) read host/port, not REDIS_URL.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: construction-dev
      # Local-only secrets. Do not reuse these anywhere else.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me-0123
      SESSION_SECRET: local-dev-session-secret-change-me-01234
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Built into the browser bundle, so it must be the address your browser uses.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # Local preview only: skip the type/lint gate so existing API type errors
        # don't block the build. Remove before deploying anywhere.
        SKIP_TYPECHECK: "1"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      PORT: "3000"
      SESSION_SECRET: local-dev-session-secret-change-me-01234
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side calls from inside the web container reach the API by its service name.
      API_INTERNAL_URL: http://api:3001
