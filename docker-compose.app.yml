# Runs the whole app locally in Docker: database, Redis, and file storage from
# docker-compose.yml, plus the API and web app built from their Dockerfiles.
#
#   docker compose -f docker-compose.app.yml up --build
#
# Then open http://localhost:3000. The API is at http://localhost:3001.
include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://construction:construction_dev@postgres:5432/construction_mgmt
      REDIS_URL: redis://redis:6379
      # The BullMQ workers (reports, QuickBooks, calendar) read host/port, not REDIS_URL.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      # Address the browser uses for file uploads and downloads (set PUBLIC_FILES_URL when using a tunnel or server).
      S3_PUBLIC_ENDPOINT: ${PUBLIC_FILES_URL:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: construction-dev
      # Signing secrets. The defaults are public (they are in this file), so set your own long random
      # values in the .env file next to this one before exposing BidAxiom beyond your own network.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me-0123}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me-01234}
      # Public addresses. Leave unset for local use; set PUBLIC_APP_URL / PUBLIC_API_URL in .env when exposing
      # BidAxiom through a tunnel or a server (the web image must be rebuilt after changing PUBLIC_API_URL).
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      # The PDF renderer opens the web app by its service name.
      WEB_INTERNAL_URL: http://web:3000
      # Email (Resend). Put RESEND_API_KEY in a file named .env next to this one; EMAIL_FROM is the
      # sending address on your verified domain.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@bidaxiom.com}
      # QuickBooks Online. Put these in the .env file next to this one. Leave them blank to keep QuickBooks off.
      #   QBO_CLIENT_ID / QBO_CLIENT_SECRET: Intuit Developer > your app > Keys & credentials (use the set that matches QBO_ENVIRONMENT).
      #   QBO_ENVIRONMENT: sandbox or production.
      #   QBO_ENCRYPTION_KEY: 64 hex characters; encrypts the saved QuickBooks (and calendar) sign-in tokens. Keep a copy: if it is lost, reconnect.
      #   QBO_WEBHOOK_VERIFIER_TOKEN: from the app's Webhooks page, if you use webhooks.
      # API_URL is the address Intuit sends people back to; register <API_URL>/api/integrations/quickbooks/callback as a Redirect URI.
      API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID:-}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET:-}
      QBO_ENVIRONMENT: ${QBO_ENVIRONMENT:-sandbox}
      QBO_ENCRYPTION_KEY: ${QBO_ENCRYPTION_KEY:-}
      QBO_WEBHOOK_VERIFIER_TOKEN: ${QBO_WEBHOOK_VERIFIER_TOKEN:-}
      # Lets a phone or laptop on the same network use the app (see docs in deploy/README if present).
      ALLOW_LAN_ORIGINS: "true"
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Built into the browser bundle, so it must be the address your browser uses.
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me-01234}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      # Server-side calls from inside the web container reach the API by its service name.
      API_INTERNAL_URL: http://api:3001
      # The local setup runs over plain http, so the session cookie cannot be "secure".
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  # Public marketing site and knowledge base (www.bidaxiom.com). Point the tunnel/proxy for www at port 3002.
  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.bidaxiom.com}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.bidaxiom.com}
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      - api
    environment:
      PORT: "3002"
      # The free-trial form is passed to the API from the server, by its service name.
      API_INTERNAL_URL: http://api:3001
