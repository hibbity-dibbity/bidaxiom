# Render Blueprint: API, web app, Postgres, and Redis.
# Secrets marked sync: false are entered in the Render dashboard.
databases:
  - name: bidaxiom-db
    databaseName: bidaxiom
    user: bidaxiom
    plan: basic-256mb

services:
  - type: keyvalue
    name: bidaxiom-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: bidaxiom-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: bidaxiom-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bidaxiom-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: bidaxiom-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        sync: false
